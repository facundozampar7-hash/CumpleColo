<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumple 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#fff0f6;--p2:#ffd6e7;--p3:#ffb3d1;--p4:#ff80b5;--p5:#e91e8c;--p6:#9c1a5c;--ink:#5a1238;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--p1),var(--p2) 60%,var(--p1));background-color:var(--p1);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;overflow-x:hidden}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.hero img{width:min(94vw,1000px);filter:drop-shadow(0 10px 18px rgba(156,26,92,.25))}
.hint{margin-top:22px;color:var(--p5);font-weight:700;animation:b 1.6s infinite}
@keyframes b{50%{transform:translateY(8px)}}
.intro{padding:70px 20px 30px;text-align:center}
.intro h2{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(2rem,6vw,3.6rem);color:var(--p5);margin:0}
.intro p{margin:10px 0 0;color:var(--p6)}
.year{max-width:1100px;margin:0 auto;padding:40px 18px 10px}
.year h3{display:inline-block;margin:0 0 16px;font-size:2rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--p4),var(--p5));padding:4px 22px;border-radius:99px;box-shadow:0 6px 16px rgba(233,30,140,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ph{aspect-ratio:1;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--p2),var(--p3));display:flex;align-items:center;justify-content:center;color:var(--p6);font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(156,26,92,.15);transition:transform .25s}
.ph:hover{transform:scale(1.03) rotate(-1deg)}
.ph img{width:100%;height:100%;object-fit:cover}
.rv{opacity:0;transform:translateY(30px);transition:all .7s}.rv.in{opacity:1;transform:none}
.vids{background:linear-gradient(180deg,var(--p3),var(--p4));margin-top:60px;padding:50px 18px 70px}
.vids h2{font-family:'Pacifico',cursive;font-weight:400;color:#fff;text-align:center;font-size:clamp(1.8rem,5vw,3rem);margin:0 0 24px}
.vg{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.v{aspect-ratio:16/9;border-radius:18px;background:var(--p1);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--p6);font-weight:600}
.v video{width:100%;height:100%;background:#000}
footer{text-align:center;padding:30px;color:var(--p6);font-weight:600}
#lb{position:fixed;inset:0;background:rgba(90,18,56,.9);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:12px}

#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:20;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:linear-gradient(135deg,var(--p4),var(--p5));color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 16px rgba(233,30,140,.4);display:flex;align-items:center;justify-content:center}
#mb.on{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#yt{position:fixed;width:2px;height:2px;left:-10px;bottom:0;opacity:0;pointer-events:none}
</style></head><body>
<section class="hero"><img src="img/hero.png" alt="Feliz cumple"><div class="hint">↓ Deslizá ↓</div></section>
<section class="intro rv"><h2>Toda una vida compartiendo juntas</h2><p>Un recorrido por nuestros años 💕</p></section>
<main id="m"></main>
<section class="vids"><h2>Videos para recordar 🎬</h2><div class="vg" id="vg"></div></section>
<footer>Con todo el cariño 💖</footer>
<div id="lb"></div>
<button id="mb" aria-label="Pausar o reproducir música" title="Música">🎵</button><div id="yt"></div>
<script>
// Cantidad de fotos por año. Fotos: fotos/2013-1.jpg, 2013-2.jpg ... | Videos: videos/1.mp4 ... videos/5.mp4
const Y={2013:4,2014:4,2016:5,2017:8,2018:4,2019:8,2020:2,2021:2,2022:3,2023:2,2024:6,2025:4,2026:8};
const m=document.getElementById('m'),lb=document.getElementById('lb');
for(const [y,n] of Object.entries(Y)){
  const s=document.createElement('section');s.className='year rv';
  s.innerHTML='<h3>'+y+'</h3><div class="grid"></div>';
  const g=s.querySelector('.grid');
  for(let i=1;i<=n;i++){
    const d=document.createElement('div');d.className='ph';d.textContent='📷 '+y+' · '+i;
    const im=new Image();im.loading='lazy';im.alt='Foto '+y;
    im.onload=()=>{d.textContent='';d.appendChild(im);d.onclick=()=>{lb.innerHTML='';const b=new Image();b.src=im.src;lb.appendChild(b);lb.classList.add('on')}};
    im.src='fotos/'+y+'-'+i+'.jpg';
    g.appendChild(d);
  }
  m.appendChild(s);
}
lb.onclick=()=>lb.classList.remove('on');
const vg=document.getElementById('vg');
for(let i=1;i<=5;i++){
  const d=document.createElement('div');d.className='v';d.textContent='🎬 Video '+i;
  const v=document.createElement('video');v.controls=true;v.preload='metadata';v.playsInline=true;
  v.onloadedmetadata=()=>{d.textContent='';d.appendChild(v)};
  v.src='videos/'+i+'.mp4';vg.appendChild(d);
}
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in')}),{threshold:.1});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));

// MÚSICA: usa musica.mp3 si existe; si no, el video de YouTube (funciona al alojar la página en tu propio sitio)
const YT_ID='ktOR7tQejtY',mb=document.getElementById('mb');
let mode='audio',playing=false,ytp=null,ytReady=false,want=false;
const au=new Audio('musica.mp3');au.loop=true;au.volume=.6;
function setUI(){mb.classList.toggle('on',playing);mb.textContent=playing?'🎵':'🔇'}
function loadYT(){
  if(mode==='yt')return;mode='yt';
  window.onYouTubeIframeAPIReady=()=>{ytp=new YT.Player('yt',{width:'2',height:'2',videoId:YT_ID,
    playerVars:{loop:1,playlist:YT_ID,playsinline:1,controls:0},
    events:{onReady:()=>{ytReady=true;ytp.setVolume(60);if(want)ytp.playVideo()},
            onStateChange:e=>{playing=e.data===1;setUI()}}})};
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
}
au.addEventListener('error',loadYT);
function play(){want=true;if(mode==='audio')au.play().then(()=>{playing=true;setUI()}).catch(()=>{});else if(ytReady)ytp.playVideo()}
function pause(){want=false;if(mode==='audio'){au.pause();playing=false;setUI()}else if(ytReady)ytp.pauseVideo()}
mb.onclick=e=>{e.stopPropagation();started=true;playing?pause():play()};
let started=false;
['pointerdown','touchstart','keydown','scroll'].forEach(ev=>addEventListener(ev,()=>{if(!started){started=true;play()}},{once:false,passive:true}));
setUI();
</script></body></html>
